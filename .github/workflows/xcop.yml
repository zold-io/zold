---
# yamllint disable rule:line-length
name: xcop
'on':
  push:
    paths:
      - '**.xsl'
      - '**.xml'
      - '**.xhtml'
      - '**.html'
      - '**.xsd'
      - '.github/workflows/xcop.yml'
  pull_request:
    paths:
      - '**.xsl'
      - '**.xml'
      - '**.xhtml'
      - '**.html'
      - '**.xsd'
      - '.github/workflows/xcop.yml'
jobs:
  xcop:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: g4s8/xcop-action@master
